name: Sync Facebook Posts

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-facebook-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Facebook posts JSON
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_POSTS_LIMIT: '8'
        run: node scripts/sync-facebook-posts.mjs

      - name: Commit updated feed
        run: |
          if git diff --quiet -- public/data/facebook-posts.json; then
            echo "No feed updates"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/facebook-posts.json
          git commit -m "chore: sync facebook posts"
          git push
